<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | EstateLuxe</title>
  <meta name="description" content="Reset your EstateLuxe account password.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <a href="index.html" class="footer-logo" style="justify-content:center;margin-bottom:16px">
          <span class="nav-logo-icon">E</span>
          EstateLuxe
        </a>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send you a reset link</p>
      </div>
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
      </form>
      <div class="auth-footer">
        <p><a href="login.html">Back to Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- Back to Top -->
  <button class="back-to-top" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showToast('Please enter your email', 'error');
        return;
      }

      showToast('Password reset link sent to your email', 'success');
    });
  </script>
</body>
</html>
